services:
  exposim:
    image: exposim:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exposim
    restart: unless-stopped
    ports:
      - "${EXPOSIM_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Développement : code monté en volume + rechargement à chaud.
  # Lancez-le UNE FOIS avec :  docker compose --profile dev up -d exposim-dev
  # Puis modifiez les fichiers : le navigateur se rafraîchit tout seul (HMR).
  # Aucun rebuild nécessaire — arrêt/relance par simple clic dans Docker Desktop.
  exposim-dev:
    image: node:22-alpine
    profiles: ["dev"]
    container_name: exposim-dev
    restart: unless-stopped
    working_dir: /app
    init: true
    ports:
      - "5173:5173"
      - "3001:3000"
    volumes:
      - .:/app
      # les dépendances vivent dans un volume interne (rapide), pas dans le code Windows
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      # détection fiable des changements de fichiers sur un montage Windows
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "-lc", "npm install --no-audit --no-fund && npm run dev"]